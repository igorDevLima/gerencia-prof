<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="Gerenciamento de professores, matérias e entregas de tarefas." />
  <title>Gerência Prof — Gestão de Professores</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="img/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar / navegação -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="img/icon.svg" alt="" class="brand__logo" width="34" height="34" />
        <div class="brand__text">
          <strong>Gerência Prof</strong>
          <span>Gestão de professores</span>
        </div>
      </div>
      <nav class="nav" aria-label="Navegação principal">
        <a href="#/painel" class="nav__link" data-route="painel">
          <span class="nav__icon" aria-hidden="true">📊</span><span>Painel</span>
        </a>
        <a href="#/professores" class="nav__link" data-route="professores">
          <span class="nav__icon" aria-hidden="true">👩‍🏫</span><span>Professores</span>
        </a>
        <a href="#/tarefas" class="nav__link" data-route="tarefas">
          <span class="nav__icon" aria-hidden="true">📝</span><span>Tarefas</span>
        </a>
        <a href="#/observacoes" class="nav__link" data-route="observacoes">
          <span class="nav__icon" aria-hidden="true">👁️</span><span>Observação de aula</span>
        </a>
        <a href="#/relatorios" class="nav__link" data-route="relatorios">
          <span class="nav__icon" aria-hidden="true">📄</span><span>Relatórios</span>
        </a>
        <a href="#/backup" class="nav__link" data-route="backup">
          <span class="nav__icon" aria-hidden="true">💾</span><span>Backup</span>
        </a>
      </nav>
      <div class="sidebar__footer">
        <small>Dados salvos apenas neste dispositivo.</small>
      </div>
    </aside>

    <!-- Conteúdo principal -->
    <div class="main">
      <header class="topbar">
        <button class="topbar__menu" id="menuToggle" aria-label="Abrir menu">☰</button>
        <h1 class="topbar__title" id="pageTitle">Painel</h1>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>

    <!-- Navegação inferior (mobile) -->
    <nav class="bottomnav" aria-label="Navegação inferior">
      <a href="#/painel" class="bottomnav__link" data-route="painel"><span aria-hidden="true">📊</span><small>Painel</small></a>
      <a href="#/professores" class="bottomnav__link" data-route="professores"><span aria-hidden="true">👩‍🏫</span><small>Profs</small></a>
      <a href="#/tarefas" class="bottomnav__link" data-route="tarefas"><span aria-hidden="true">📝</span><small>Tarefas</small></a>
      <a href="#/observacoes" class="bottomnav__link" data-route="observacoes"><span aria-hidden="true">👁️</span><small>Obs.</small></a>
      <a href="#/relatorios" class="bottomnav__link" data-route="relatorios"><span aria-hidden="true">📄</span><small>Relatos</small></a>
      <a href="#/backup" class="bottomnav__link" data-route="backup"><span aria-hidden="true">💾</span><small>Backup</small></a>
    </nav>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__header">
        <h2 id="modalTitle">Título</h2>
        <button class="modal__close" data-close-modal aria-label="Fechar">×</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="js/letterhead.js"></script>
  <script src="js/docx.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
